<section class="bg-cream">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <div class="flex items-end justify-between mb-10">
      <div>
        <p class="font-body text-xs uppercase tracking-[0.2em] text-gold mb-3">Moments</p>
        <h2 class="font-heading text-3xl sm:text-4xl text-navy">Gallery</h2>
      </div>
      <a href="{% url 'gallery:list' %}" class="font-body text-sm font-semibold text-navy hover:text-gold-dark transition-colors whitespace-nowrap hidden sm:block">
        View All →
      </a>
    </div>

    {% if preview_images %}
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        {% for img in preview_images %}
          <a href="{% url 'gallery:detail' img.album.slug %}" class="block aspect-square rounded-lg overflow-hidden group">
            <img src="{{ img.image.url }}" alt="{{ img.display_alt }}" loading="lazy"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          </a>
        {% endfor %}
      </div>
      <a href="{% url 'gallery:list' %}" class="block sm:hidden text-center font-body text-sm font-semibold text-navy hover:text-gold-dark transition-colors mt-8">
        View Full Gallery →
      </a>
    {% else %}
      <p class="font-body text-navy/50">Photos coming soon.</p>
    {% endif %}
  </div>
</section>
