{% extends "base.html" %}
{% block title %}{{ page.seo_title|default:page.title }} : {{ church_settings.church_name }}{% endblock %}
{% block meta_description %}{{ page.seo_description }}{% endblock %}

{% block content %}
<section class="bg-white">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <h1 class="font-heading text-4xl text-navy mb-8">{{ page.title }}</h1>
    <div class="font-body text-navy/70 leading-relaxed">
      {{ page.body|linebreaks }}
    </div>
  </div>
</section>
{% endblock %}
