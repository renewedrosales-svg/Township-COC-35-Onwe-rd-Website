{% extends "base.html" %}
{% block title %}Sign In — 35 Onwe Road Church of Christ{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-24">
  <h1 class="font-heading text-3xl text-navy mb-6">Sign In</h1>

  {% if form.errors %}
    <p class="text-red-600 font-body text-sm mb-4">Invalid username or password. Please try again.</p>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block font-body text-sm text-navy/70 mb-1">Username</label>
      {{ form.username }}
    </div>
    <div>
      <label class="block font-body text-sm text-navy/70 mb-1">Password</label>
      {{ form.password }}
    </div>
    <button type="submit" class="w-full bg-gold text-navy-dark font-semibold py-2.5 rounded-full hover:bg-gold-dark transition-colors">
      Sign In
    </button>
  </form>
</div>
{% endblock %}
