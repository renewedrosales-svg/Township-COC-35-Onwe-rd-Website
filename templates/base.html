{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <title>{% block title %}35 Onwe Road Church of Christ, Abakaliki{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/output.css' %}">

</html>
