{% extends "dashboard/base.html" %}
{% block title %}Delete {{ object }}{% endblock %}

{% block dashboard_content %}
<div class="bg-white rounded-lg shadow-sm p-6 max-w-lg">
  <h1 class="font-heading text-xl text-navy mb-3">Delete "{{ object }}"?</h1>
  <p class="font-body text-sm text-navy/60 mb-6">This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="flex gap-3">
      <button type="submit" class="bg-red-600 text-white font-body text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-red-700 transition-colors">
        Yes, Delete
      </button>
      <a href="{{ cancel_url }}" class="font-body text-sm text-navy/60 px-6 py-2.5 hover:text-navy">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
