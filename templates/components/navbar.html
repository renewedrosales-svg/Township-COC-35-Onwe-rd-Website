{% load static %}
<header class="bg-navy text-white sticky top-0 z-50 shadow-sm" x-data="{ mobileOpen: false }">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">

      <a href="{% url 'home' %}" class="flex items-center gap-3">
        {% if church_settings.logo %}
          <img src="{{ church_settings.logo.url }}"
              alt="{{ church_settings.church_name }}"
              class="h-12 w-auto">
        {% else %}
          <span class="font-heading text-xl text-gold tracking-wide">
            {{ church_settings.church_name }}
          </span>
        {% endif %}
      </a>

      <nav class="hidden lg:flex items-center gap-8 font-body text-sm">
        <a href="{% url 'pages:about' %}" class="hover:text-gold transition-colors">About Us</a>
        <a href="{% url 'ministries:list' %}" class="hover:text-gold transition-colors">Ministries</a>
        <a href="{% url 'sermons:list' %}" class="hover:text-gold transition-colors">Teachings</a>
        <a href="{% url 'events:list' %}" class="hover:text-gold transition-colors">Events</a>
        <a href="#" class="hover:text-gold transition-colors">News</a>
        <a href="#" class="hover:text-gold transition-colors">Gallery</a>
        <a href="#" class="hover:text-gold transition-colors">Contact</a>
      </nav>

      <a href="{% url 'home' %}#visit"
         class="hidden lg:inline-flex items-center gap-2 bg-gold text-navy-dark font-body font-semibold text-sm px-5 py-2.5 rounded-full hover:bg-gold-dark transition-colors">
        Visit Us
      </a>

      <button
        class="lg:hidden text-white"
        @click="mobileOpen = !mobileOpen"
        :aria-expanded="mobileOpen"
        aria-label="Toggle navigation menu">
        <svg x-show="!mobileOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg x-show="mobileOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

    </div>
  </div>

  <nav
    x-show="mobileOpen"
    x-transition
    @click.outside="mobileOpen = false"
    class="lg:hidden bg-navy-dark px-4 pb-6 pt-2 flex flex-col gap-4 font-body text-sm"
    style="display:none;">
    <a href="{% url 'pages:about' %}" class="hover:text-gold transition-colors">About Us</a>
    <a href="{% url 'ministries:list' %}" class="hover:text-gold transition-colors">Ministries</a>
    <a href="{% url 'sermons:list' %}" class="hover:text-gold transition-colors">Teachings</a>
    <a href="{% url 'events:list' %}" class="hover:text-gold transition-colors">Events</a>
    <a href="#" class="hover:text-gold transition-colors">News</a>
    <a href="#" class="hover:text-gold transition-colors">Gallery</a>
    <a href="#" class="hover:text-gold transition-colors">Contact</a>
    <a href="#" class="mt-2 inline-flex justify-center bg-gold text-navy-dark font-semibold px-5 py-2.5 rounded-full">
      Visit Us
    </a>
  </nav>
</header>
