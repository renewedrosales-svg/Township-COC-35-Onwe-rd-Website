<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong</title>
  <style>
    /* Inline styles ONLY — this page must render correctly even if
       static file serving itself is part of what's broken. No
       external stylesheet, no font files, no database queries,
       nothing that could fail while trying to display a failure. */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1f3d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .code { font-size: 3.5rem; color: #c9a24b; margin: 0 0 1rem; font-weight: 700; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { color: rgba(255,255,255,0.6); margin: 0 0 2rem; }
    a {
      display: inline-block;
      background: #c9a24b;
      color: #0a1529;
      font-weight: 600;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div>
    <p class="code">500</p>
    <h1>Something Went Wrong</h1>
    <p>We're experiencing a technical issue. Please try again shortly.</p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
